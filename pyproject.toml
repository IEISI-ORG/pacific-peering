[project]
name = "pacific-peering"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Terry Sweetser", email = "tcs@ieisi.org" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
pacific-peering = "pacific_peering:main"
pacific-peering-discover-asns = "pacific_peering.discovery.registry:main"
pacific-peering-ris-smoketest = "pacific_peering.ris.smoketest:main"
pacific-peering-fishbowl = "pacific_peering.analysis.fishbowl:main"
pacific-peering-atlas-smoketest = "pacific_peering.atlas.smoketest:main"
pacific-peering-atlas-inbound-smoketest = "pacific_peering.atlas.smoketest:main_inbound"
pacific-peering-atlas-coverage = "pacific_peering.atlas.probes:main"
pacific-peering-triangulate = "pacific_peering.analysis.traceroute_topology:main"
pacific-peering-feasibility = "pacific_peering.analysis.feasibility:main"
pacific-peering-ixp-lan-registry = "pacific_peering.analysis.ixp_lan_registry:main"
pacific-peering-pipeline = "pacific_peering.pipeline:main"
pacific-peering-viz-detours = "pacific_peering.viz.geographic:main"
pacific-peering-viz-as-graph = "pacific_peering.viz.as_graph:main"
pacific-peering-report-ascii = "pacific_peering.reports.ascii_report:main"
pacific-peering-report-html = "pacific_peering.reports.html_report:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
